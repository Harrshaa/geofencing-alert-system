# Runs the whole system locally:  docker compose up --build
#
#   frontend  http://localhost:3000
#   backend   http://localhost:8080
#   database  localhost:5433  (5433 so it does not clash with a local PostgreSQL on 5432)

services:
  db:
    build: ./database
    environment:
      POSTGRES_USER: geofence
      POSTGRES_PASSWORD: geofence
      POSTGRES_DB: geofence
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geofence -d geofence"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-geofence-alerts-backend}
    environment:
      PORT: "8080"
      # "db" is the service name above; Compose makes it a hostname.
      DATABASE_URL: postgres://geofence:geofence@db:5432/geofence?sslmode=disable
      CORS_ALLOWED_ORIGINS: "*"
      RATE_LIMIT_PER_SECOND: "20"
      RATE_LIMIT_BURST: "40"
      # JWT authentication. Off by default so the API matches the brief.
      # To turn it on for a demo:  AUTH_REQUIRED=true docker compose up -d
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-in-production-0123456789}
      JWT_TTL: 12h
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the API, so this is the address as seen from your machine.
        API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
